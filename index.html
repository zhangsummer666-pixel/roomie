<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>合租生活管家 · Roomie</title>
<meta name="description" content="合租生活管家：费用AA分摊、清洁值日排班、公共物品登记提醒、室友公约管理，让合租生活更轻松。">
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:#eceef1;
    --text:#1f2937;
    --text2:#6b7280;
    --text3:#9ca3af;
    --primary:#ff6b5b;
    --primary-dark:#e85546;
    --primary-soft:#fff0ed;
    --teal:#14b8a6;
    --teal-soft:#e6f7f4;
    --amber:#f59e0b;
    --amber-soft:#fef3e2;
    --violet:#8b5cf6;
    --violet-soft:#f0ebff;
    --blue:#4a90d9;
    --blue-soft:#eaf3fb;
    --green:#22c55e;
    --red:#ef4444;
    --shadow:0 1px 3px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.05);
    --shadow-lg:0 12px 40px rgba(17,24,39,.14);
    --radius:16px;
    --radius-sm:10px;
    --sidebar-w:236px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d6d9de;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#bcc0c6}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
  a{color:inherit;text-decoration:none}

  /* ===== Layout ===== */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);
    padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
  .brand-logo{
    width:42px;height:42px;border-radius:12px;flex:0 0 42px;
    background:linear-gradient(135deg,#ff8a70,#ff6b5b 55%,#f43f5e);
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 4px 12px rgba(255,107,91,.35);
  }
  .brand-name{font-size:17px;font-weight:800;letter-spacing:.3px}
  .brand-sub{font-size:11px;color:var(--text3);font-weight:500}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
    color:var(--text2);font-weight:500;font-size:14.5px;transition:.15s;position:relative;
  }
  .nav-item:hover{background:#f6f7f9;color:var(--text)}
  .nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav-item .ico{font-size:18px;width:22px;text-align:center}
  .nav-item .badge{
    margin-left:auto;background:var(--primary);color:#fff;font-size:11px;font-weight:700;
    border-radius:99px;padding:1px 7px;min-width:18px;text-align:center;
  }
  .sidebar-foot{padding:12px 10px 0;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}
  .sidebar-foot b{color:var(--text2)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    padding:20px 32px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .page-title{font-size:22px;font-weight:800;letter-spacing:.2px}
  .page-desc{color:var(--text3);font-size:13px;margin-top:2px}
  .topbar-actions{display:flex;gap:10px;align-items:center}
  .content{padding:22px 32px 40px;max-width:1120px;width:100%;margin:0 auto}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:10px 18px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s;
    border:1px solid transparent;white-space:nowrap;
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(255,107,91,.3)}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
  .btn-ghost{background:#fff;color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{border-color:#d6d9de;background:#fafbfc}
  .btn-soft{background:var(--primary-soft);color:var(--primary)}
  .btn-soft:hover{background:#ffe3dd}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:9px}
  .btn-block{width:100%}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn-danger{color:var(--red);background:#fff;border-color:#fecaca}
  .btn-danger:hover{background:#fef2f2}

  /* ===== Cards ===== */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-pad{padding:22px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .card-title{font-size:16px;font-weight:700}
  .card-sub{font-size:12.5px;color:var(--text3);font-weight:400;margin-left:8px}

  /* ===== Grid ===== */
  .grid{display:grid;gap:18px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:960px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

  /* ===== Stat tiles ===== */
  .stat{position:relative;overflow:hidden}
  .stat .ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
  .stat .label{font-size:13px;color:var(--text2);font-weight:500}
  .stat .value{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
  .stat .unit{font-size:14px;font-weight:600;color:var(--text3);margin-left:2px}
  .stat .foot{font-size:12px;color:var(--text3);margin-top:6px}
  .stat .deco{position:absolute;right:-14px;top:-14px;font-size:74px;opacity:.07}

  /* ===== Chips / tags ===== */
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .chip-red{background:#fee2e2;color:#dc2626}
  .chip-green{background:#dcfce7;color:#16a34a}
  .chip-amber{background:var(--amber-soft);color:#d97706}
  .chip-gray{background:#f1f2f4;color:var(--text2)}
  .chip-teal{background:var(--teal-soft);color:var(--teal)}
  .chip-violet{background:var(--violet-soft);color:var(--violet)}
  .chip-blue{background:var(--blue-soft);color:var(--blue)}

  /* ===== Lists ===== */
  .list{display:flex;flex-direction:column}
  .list-item{
    display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #f1f2f4;
  }
  .list-item:last-child{border-bottom:none}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:16px;color:#fff;
  }
  .avatar-lg{width:54px;height:54px;font-size:21px;flex-basis:54px}
  .item-main{flex:1;min-width:0}
  .item-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px}
  .item-sub{font-size:12.5px;color:var(--text3);margin-top:1px}
  .item-side{text-align:right;flex-shrink:0}
  .money{font-weight:700}
  .money-pos{color:var(--teal)}
  .money-neg{color:var(--primary)}

  /* ===== Empty state ===== */
  .empty{
    text-align:center;padding:48px 20px;color:var(--text3);
  }
  .empty .big{font-size:52px;margin-bottom:12px}
  .empty .t{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:4px}
  .empty .s{font-size:13px;margin-bottom:18px}

  /* ===== Modal ===== */
  .modal-mask{
    position:fixed;inset:0;background:rgba(17,24,39,.45);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:16px;
    animation:fade .2s;
  }
  @media(min-width:600px){.modal-mask{align-items:center}}
  .modal{
    background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:88vh;overflow:auto;
    animation:pop .22s cubic-bezier(.2,.9,.3,1.2);box-shadow:var(--shadow-lg);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px;position:sticky;top:0;background:#fff;z-index:2}
  .modal-title{font-size:17px;font-weight:800}
  .modal-close{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px;transition:.15s}
  .modal-close:hover{background:#f2f3f5;color:var(--text)}
  .modal-body{padding:14px 22px 22px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}

  /* ===== Forms ===== */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px}
  .field label .req{color:var(--primary)}
  .input,select.input,textarea.input{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
    background:#fafbfc;transition:.15s;outline:none;
  }
  .input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
  textarea.input{resize:vertical;min-height:76px}
  .row{display:flex;gap:12px}
  .row>*{flex:1}
  .seg{display:flex;background:#f1f2f4;border-radius:11px;padding:3px;gap:2px}
  .seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);transition:.15s}
  .seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .check-item{
    display:flex;align-items:center;gap:8px;padding:9px 11px;border:1.5px solid var(--border);
    border-radius:10px;cursor:pointer;transition:.15s;font-size:13.5px;font-weight:500;
  }
  .check-item.on{border-color:var(--primary);background:var(--primary-soft)}
  .check-item input{display:none}

  /* ===== Toast ===== */
  .toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
  .toast{
    background:#1f2937;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:500;
    box-shadow:var(--shadow-lg);animation:toastin .25s;display:flex;align-items:center;gap:8px;
  }
  .toast.success{background:#0f9d6e}
  .toast.warn{background:#d97706}
  @keyframes toastin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

  /* ===== Expense specific ===== */
  .exp-cat{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 38px}
  .group-label{padding:18px 0 6px;font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.5px}
  .split-pill{font-size:11.5px;color:var(--text3);background:#f1f2f4;padding:2px 8px;border-radius:6px;font-weight:600}

  /* ===== Chore ===== */
  .chore-card{padding:18px;display:flex;align-items:center;gap:14px}
  .chore-emoji{width:50px;height:50px;border-radius:14px;background:#f6f7f9;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 50px}
  .freq-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .freq-overdue{background:var(--red)}
  .freq-ok{background:var(--green)}

  /* ===== Item ===== */
  .stock-bar{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:8px}
  .stock-fill{height:100%;border-radius:99px;background:var(--green);transition:.3s}
  .stock-fill.low{background:var(--amber)}
  .stock-fill.empty{background:var(--red)}
  .qty-btn{width:30px;height:30px;border-radius:9px;background:#f1f2f4;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.12s}
  .qty-btn:hover{background:#e5e7eb}
  .qty-val{min-width:30px;text-align:center;font-weight:700;font-size:15px}

  /* ===== Rule ===== */
  .rule-card{padding:20px;position:relative}
  .rule-cat{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
  .rule-title{font-size:15.5px;font-weight:700;margin-bottom:6px}
  .rule-content{font-size:13.5px;color:var(--text2);white-space:pre-wrap}

  /* ===== Donut chart ===== */
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px}
  .legend-row{display:flex;align-items:center;gap:9px;font-size:13px}
  .legend-dot{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
  .legend-row .nm{flex:1;color:var(--text2)}
  .legend-row .amt{font-weight:600}
  .legend-row .pct{color:var(--text3);font-size:12px;width:44px;text-align:right}

  /* ===== Mobile bottom nav ===== */
  .bottom-nav{display:none}
  @media(max-width:768px){
    .sidebar{display:none}
    .topbar{padding:16px 18px 0}
    .content{padding:16px 18px 100px}
    .bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
      padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:90;justify-content:space-around;
    }
    .bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--text3);padding:5px 10px;border-radius:10px;font-weight:500}
    .bn-item .ico{font-size:20px;position:relative}
    .bn-item.active{color:var(--primary)}
    .bn-item .dot{position:absolute;top:-1px;right:-7px;width:8px;height:8px;background:var(--primary);border-radius:50%;border:2px solid #fff}
    .stat .value{font-size:23px}
  }

  .muted{color:var(--text3)}
  .flex{display:flex;align-items:center;gap:10px}
  .mt-16{margin-top:16px}
  .mb-16{margin-bottom:16px}
  .fade-in{animation:fadein .3s}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .settle-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed #eef0f3}
  .settle-row:last-child{border-bottom:none}
  .arrow{color:var(--text3);font-weight:700}
  .kbd{font-size:12px;background:#f1f2f4;border-radius:6px;padding:2px 7px;color:var(--text2);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">🏠</div>
      <div>
        <div class="brand-name">合租生活管家</div>
        <div class="brand-sub">Roomie · 让合租更省心</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">数据保存在<b>本机浏览器</b><br>可导出备份 · 无需登录</div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="pageTitle">概览</div>
        <div class="page-desc" id="pageDesc"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="openExport()" title="导出/导入数据">💾 数据</button>
        <button class="btn btn-primary" id="topAddBtn" onclick="globalAdd()">＋ 记一笔</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Bottom nav (mobile) -->
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Modal mount -->
<div id="modalRoot"></div>
<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =====================================================================
   合租生活管家 · Roomie
   纯前端单文件应用，数据用 localStorage 持久化
   ===================================================================== */

const LS_KEY = 'roomie_data_v3';
const NAV = [
  {id:'dashboard', name:'概览',   ico:'🏠', desc:'合租生活一屏掌握'},
  {id:'expense',   name:'费用AA', ico:'💸', desc:'记账 · 分摊 · 结算'},
  {id:'chore',     name:'值日排班', ico:'🧹', desc:'清洁值日自动轮换'},
  {id:'item',      name:'公共物品', ico:'🧻', desc:'库存登记与补货提醒'},
  {id:'rule',      name:'室友公约', ico:'📜', desc:'共同约定 · 一起遵守'},
  {id:'roommate',  name:'室友',    ico:'👥', desc:'管理同住成员'},
];

const CATS = {
  '房租':  {ico:'🏠', color:'#ff6b5b', bg:'#ffe9e6'},
  '水电燃气':{ico:'💡', color:'#4a90d9', bg:'#e8f1fb'},
  '网费':  {ico:'📶', color:'#8b5cf6', bg:'#f0ebff'},
  '日用品':{ico:'🧻', color:'#14b8a6', bg:'#e6f7f4'},
  '餐饮':  {ico:'🍜', color:'#f59e0b', bg:'#fef3e2'},
  '维修':  {ico:'🔧', color:'#94a3b8', bg:'#f1f5f9'},
  '其他':  {ico:'📦', color:'#64748b', bg:'#eef1f4'},
};

const CHORE_EMOJIS = ['🧹','🍽️','🗑️','🚽','🛁','🧺','🪟','🧊','🌿','🛋️'];
const AVATAR_COLORS = ['#ff6b5b','#4a90d9','#14b8a6','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
const ITEM_UNITS = ['个','卷','瓶','袋','包','盒','桶','支','提','箱'];

/* ---------- state ---------- */
let data = load();
let currentPage = 'dashboard';
let editingId = null;

function defaultData(){
  return {
    roommates:[], expenses:[], chores:[], items:[], rules:[], points:{}
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); return Object.assign(defaultData(), d); }
  }catch(e){}
  return seed();
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(data));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){
  if(n == null || isNaN(n)) return '0.00';
  return (Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function money(n){ return '¥' + fmt(n); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);
  if(diff===0) return '今天';
  if(diff===1) return '昨天';
  const md = `${d.getMonth()+1}月${d.getDate()}日`;
  return d.getFullYear()===now.getFullYear() ? md : `${d.getFullYear()}年${md}`;
}
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){
  const [y,m]=key.split('-'); const n=new Date(); const c=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
  const labels=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  return `${Number(m)}月` + (key===c?'（本月）':'');
}
function rm(id){ return data.roommates.find(r=>r.id===id); }
function rmName(id){ const r=rm(id); return r?r.name:'已退出'; }
function avatarHTML(r, size){
  const initial = (r.name||'?').trim().charAt(0).toUpperCase();
  return `<div class="avatar ${size?'avatar-lg':''}" style="background:${r.color||'#94a3b8'}">${initial}</div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- seed demo data ---------- */
function seed(){
  const d = defaultData();
  const p1={id:'r1',name:'小夏',color:AVATAR_COLORS[0]};
  const p2={id:'r2',name:'阿哲',color:AVATAR_COLORS[1]};
  const p3={id:'r3',name:'老王',color:AVATAR_COLORS[2]};
  const p4={id:'r4',name:'Lily',color:AVATAR_COLORS[3]};
  d.roommates=[p1,p2,p3,p4];

function donutByCategory(exps){
  const agg={};
  exps.forEach(e=>{ agg[e.cat]=(agg[e.cat]||0)+Number(e.amount); });
  const entries = Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,e)=>s+e[1],0);
  const colors = entries.map(([cat])=>CATS[cat]?CATS[cat].color:'#94a3b8');
  let acc=0;
  const segs = entries.map(([cat,v],i)=>{
    const start=acc; acc+=v;
    return donutSeg(start/total, acc/total, colors[i]);
  }).join('');
  const size=150, r=60, cx=75, cy=75;
  const svg = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${segs || `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#eef0f3"/>`}
    <circle cx="${cx}" cy="${cy}" r="38" fill="#fff"/>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2937">${total>=10000?(total/10000).toFixed(1)+'万':'¥'+Math.round(total)}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#9ca3af">本月合计</text>
  </svg>`;
  return `<div class="donut-wrap">
    ${svg}
    <div class="legend">
      ${entries.map(([cat,v])=>{
        const pct = (v/total*100).toFixed(1);
        const c=CATS[cat]||{color:'#94a3b8',ico:'📦'};
        return `<div class="legend-row"><span class="legend-dot" style="background:${c.color}"></span><span>${c.ico} ${esc(cat)}</span><span class="nm"></span><span class="amt">${money(v)}</span><span class="pct">${pct}%</span></div>`;
      }).join('')}
    </div>
  </div>`;
}
function donutSeg(a,b,color){
  const large = (b-a)>0.5?1:0;
  const x1=75+60*Math.cos(2*Math.PI*a-Math.PI/2), y1=75+60*Math.sin(2*Math.PI*a-Math.PI/2);
  const x2=75+60*Math.cos(2*Math.PI*b-Math.PI/2), y2=75+60*Math.sin(2*Math.PI*b-Math.PI/2);
  return `<path d="M75 75 L${x1} ${y1} A60 60 0 ${large} 1 ${x2} ${y2} Z" fill="${color}"/>`;
}

function computeBalances(){
  const map={};
  data.roommates.forEach(r=>map[r.id]=0);
  data.expenses.forEach(e=>{
    const amount=Number(e.amount);
    map[e.paidBy]=(map[e.paidBy]||0)+amount;   // 垫付人 +amount
    const shares = computeShares(e);            // 每人应付金额
    Object.entries(shares).forEach(([id,v])=>{ map[id]=(map[id]||0)-v; });
  });
  return data.roommates.map(r=>({id:r.id, name:r.name, color:r.color, balance:Math.round((map[r.id]||0)*100)/100}));
}

/* 根据分摊方式计算每人应付金额 */
function computeShares(e){
  const amount=Number(e.amount);
  const members = e.split?.members || [];
  const type = e.split?.type || 'equal';
  const map = e.split?.map || {};
  const shares={};
  if(type==='equal'){
    const n=members.length||1;
    members.forEach(id=>shares[id]=amount/n);
  } else if(type==='ratio'){
    const totalRatio=members.reduce((s,id)=>s+(Number(map[id])||0),0)||1;
    members.forEach(id=>shares[id]=amount*(Number(map[id])||0)/totalRatio);
  } else if(type==='custom'){
    members.forEach(id=>shares[id]=Number(map[id])||0);
  }
  return shares;
}

/* 债务简化：谁该给谁多少钱 */
function settleDebts(){
  const bs = computeBalances().map(b=>({id:b.id,name:b.name,color:b.color,bal:Math.round(b.balance*100)/100}));
  const creditors = bs.filter(b=>b.bal>0.005).sort((a,b)=>b.bal-a.bal);
  const debtors = bs.filter(b=>b.bal<-0.005).sort((a,b)=>a.bal-b.bal);
  const tx=[];
  let i=0,j=0;
  while(i<creditors.length && j<debtors.length){
    const c=creditors[i], d=debtors[j];
    const amt=Math.min(c.bal, -d.bal);
    if(amt>0.005){ tx.push({from:d, to:c, amount:Math.round(amt*100)/100}); }
    c.bal-=amt; d.bal+=amt;
    if(c.bal<=0.005) i++;
    if(d.bal>=-0.005) j++;
  }
  return tx;
}

function openExpenseModal(id){
  editingId = id||null;
  const e = id? data.expenses.find(x=>x.id===id) : null;
  const members = e? (e.split?.members||data.roommates.map(r=>r.id)) : data.roommates.map(r=>r.id);
  const type = e? (e.split?.type||'equal') : 'equal';

function currentSplitType(){
  const a=document.querySelector('#f-split-type .active');
  return a?a.dataset.t:'equal';
}
function renderShareRows(members, type, map){
  if(!members.length) return '<div class="muted" style="font-size:13px">请先在上方勾选参与分摊的室友</div>';
  return members.map(id=>{
    const r=rm(id); if(!r) return '';
    const v=map[id]!=null?map[id]:'';
    return `<div class="flex" style="gap:10px;margin-bottom:8px">
      <div style="width:80px;font-weight:600;font-size:13.5px">${esc(r.name)}</div>
      <input class="input" style="flex:1" type="number" step="0.01" min="0" data-id="${id}" placeholder="${type==='ratio'?'比例':'金额'}" value="${v}">
    </div>`;
  }).join('');
}
function refreshShareRows(type){
  const type_=type||currentSplitType();
  const members = getMemberIds();
  const map={};
  document.querySelectorAll('#f-share-rows input').forEach(i=>{ if(i.value) map[i.dataset.id]=Number(i.value); });
  document.getElementById('f-share-rows').innerHTML = renderShareRows(members, type_, map);
  const lbl=document.querySelector('#f-share-detail label');
  if(lbl) lbl.innerHTML = `分摊明细${type_==='ratio'?'（比例，如 1 / 2 / 1）':'（每人应付金额）'}`;
}
function getMemberIds(){
  return [...document.querySelectorAll('#f-members input:checked')].map(i=>i.value);
}
function wireCheckItems(wrapId, cb){
  const wrap=document.getElementById(wrapId);
  if(!wrap) return;
  wrap.querySelectorAll('.check-item').forEach(l=>{
    l.addEventListener('click', (e)=>{
      e.preventDefault();
      const inp=l.querySelector('input');
      if(inp.type==='radio'){ inp.checked=true; }
      else { inp.checked=!inp.checked; }
      wrap.querySelectorAll('.check-item').forEach(x=>{
        x.classList.toggle('on', x.querySelector('input').checked);
      });
      if(cb) cb();
    });
  });
}
function saveExpense(){
  const title=document.getElementById('f-title').value.trim();
  const amount=Number(document.getElementById('f-amount').value);
  const cat=document.getElementById('f-cat').value;
  const paidBy=(document.querySelector('#f-payer input:checked')||{}).value;
  const members=getMemberIds();
  const type=currentSplitType();
  if(!title){ toast('请填写账单名称','warn'); return; }
  if(!amount||amount<=0){ toast('请填写有效金额','warn'); return; }
  if(!paidBy){ toast('请选择付款人','warn'); return; }
  if(!members.length){ toast('请至少选择一位参与分摊的室友','warn'); return; }
  const map={};
  document.querySelectorAll('#f-share-rows input').forEach(i=>{ if(i.value) map[i.dataset.id]=Number(i.value); });
  if(type==='custom'){
    const sum=members.reduce((s,id)=>s+(map[id]||0),0);
    if(Math.abs(sum-amount)>0.01){ toast(`自定义金额合计 ${fmt(sum)} 与账单 ${fmt(amount)} 不符`,'warn'); return; }
  }
  const obj={title,amount,cat,paidBy,date:document.getElementById('f-date').value||todayISO(),note:document.getElementById('f-note').value.trim(),split:{type,members,map}};
  if(editingId){
    const i=data.expenses.findIndex(x=>x.id===editingId);
    data.expenses[i]=Object.assign({id:editingId},obj);
  } else {
    data.expenses.push(Object.assign({id:uid()},obj));
  }
  save(); closeModal(); render(); toast('账单已保存','success');
}
function delExpense(id){
  if(!confirm('确定删除这笔账单吗？')) return;
  data.expenses=data.expenses.filter(e=>e.id!==id);
  save(); render(); toast('已删除');
}

const FREQ={daily:{label:'每天',days:1},'2days':{label:'每 2 天',days:2},'3days':{label:'每 3 天',days:3},weekly:{label:'每周',days:7}};
function freqLabel(f){ return (FREQ[f]||FREQ.daily).label; }
function currentAssignee(ch){
  if(!data.roommates.length) return {name:'—'};
  const idx = ch.assigneeIndex!=null? ch.assigneeIndex : 0;
  return data.roommates[idx % data.roommates.length] || {name:'—'};
}
function isChoreOverdue(ch, now){
  if(!ch.lastDone) return true;
  const days=(FREQ[ch.freq]||FREQ.daily).days;
  const last=new Date(ch.lastDone);
  const diff=Math.floor((now.getTime()-last.getTime())/86400000);
  return diff >= days;
}

    </div>

  </div>`);

  });
  document.querySelectorAll('#f-freq button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#f-freq button').forEach(x=>x.classList.remove('active'));

  });
  wireCheckItems('f-assignee');
  window._choreEmoji=()=>emoji;

function saveChore(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ toast('请填写家务名称','warn'); return; }
  const emoji=window._choreEmoji?window._choreEmoji():CHORE_EMOJIS[0];
  const freq=(document.querySelector('#f-freq .active')||{dataset:{f:'daily'}}).dataset.f;
  const assignee=(document.querySelector('#f-assignee input:checked')||{}).value;
  const assigneeIndex = assignee? data.roommates.findIndex(r=>r.id===assignee) : 0;
  const obj={name,emoji,freq,assigneeIndex:assigneeIndex>=0?assigneeIndex:0};
  if(editingId){
    const i=data.chores.findIndex(x=>x.id===editingId);
    data.chores[i]=Object.assign({}, data.chores[i], obj);
  } else {
    data.chores.push(Object.assign({id:uid(),lastDone:null,doneBy:null,history:[]},obj));
  }
  save(); closeModal(); render(); toast('家务已保存','success');
}
function doChore(id){
  const ch=data.chores.find(x=>x.id===id);
  if(!ch) return;
  if(!data.roommates.length){ toast('请先添加室友','warn'); return; }
  const a=currentAssignee(ch);
  const today=todayISO();
  (ch.history=ch.history||[]).push({date:today, doneBy:a.id});
  ch.lastDone=today; ch.doneBy=a.id;
  ch.assigneeIndex = ((ch.assigneeIndex!=null?ch.assigneeIndex:0)+1) % data.roommates.length;
  data.points[a.id]=(data.points[a.id]||0)+1;
  save(); render(); toast(`${a.name} 完成「${ch.name}」+1 分！`,'success');
}
function delChore(id){
  if(!confirm('确定删除这项家务吗？')) return;
  data.chores=data.chores.filter(c=>c.id!==id);
  save(); render(); toast('已删除');
}

                <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:5px">
                  <button class="kbd" onclick="restockItem('${it.id}')">补货</button>
                  <button class="kbd" onclick="openItemModal('${it.id}')">编辑</button>
                  <button class="kbd" style="color:var(--red)" onclick="delItem('${it.id}')">删除</button>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`}
      </div>
    </div>
  </div>`;
}
function openItemModal(id){
  editingId=id||null;
  const it=id?data.items.find(x=>x.id===id):null;
  openModal(`<div class="modal-head"><div class="modal-title">${it?'编辑物品':'添加公共物品'}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>物品名称 <span class="req">*</span></label><input class="input" id="f-name" placeholder="如：抽纸" value="${it?esc(it.name):''}"></div>
    <div class="row">
      <div class="field"><label>分类</label><input class="input" id="f-cat" placeholder="日用品 / 清洁 / 食材" value="${it?esc(it.cat):'日用品'}"></div>
      <div class="field"><label>单位</label><select class="input" id="f-unit">${ITEM_UNITS.map(u=>`<option ${it&&it.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>当前数量</label><input class="input" id="f-qty" type="number" min="0" value="${it?it.qty:0}"></div>
      <div class="field"><label>低库存阈值</label><input class="input" id="f-low" type="number" min="0" value="${it?it.low:1}"></div>
    </div>
    <div class="field"><label>备注</label><input class="input" id="f-note" placeholder="如：客厅+洗手间共用" value="${it?esc(it.note||''):''}"></div>
    <button class="btn btn-primary btn-block mt-16" onclick="saveItem()">保存</button>
  </div>`);
}
function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ toast('请填写物品名称','warn'); return; }
  const obj={
    name,
    cat:document.getElementById('f-cat').value.trim()||'日用品',
    unit:document.getElementById('f-unit').value,
    qty:Number(document.getElementById('f-qty').value)||0,
    low:Number(document.getElementById('f-low').value)||0,
    note:document.getElementById('f-note').value.trim(),
  };
  if(editingId){
    const i=data.items.findIndex(x=>x.id===editingId);
    obj.lastBuyer=data.items[i].lastBuyer;
    data.items[i]=Object.assign({}, data.items[i], obj);
  } else {
    data.items.push(Object.assign({id:uid(), lastBuyer:data.roommates[0]?data.roommates[0].id:null}, obj));
  }
  save(); closeModal(); render(); toast('物品已保存','success');
}
function adjItem(id,d){
  const it=data.items.find(x=>x.id===id); if(!it) return;
  it.qty=Math.max(0, it.qty+d);
  save(); render();
}
function restockItem(id){
  const it=data.items.find(x=>x.id===id); if(!it) return;
  openModal(`<div class="modal-head"><div class="modal-title">🛒 补货「${esc(it.name)}」</div><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>补货数量（${it.unit}）</label><input class="input" id="f-qty" type="number" min="1" value="1"></div>
    <div class="field"><label>谁去采购</label>
      <div class="check-grid" id="f-buyer">${data.roommates.map(r=>`<label class="check-item ${r.id===(it.lastBuyer||data.roommates[0]?.id)?'on':''}">${avatarHTML(r)}<span>${esc(r.name)}</span><input type="radio" name="buyer" value="${r.id}" ${r.id===(it.lastBuyer||data.roommates[0]?.id)?'checked':''}></label>`).join('')}</div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveRestock('${it.id}')">确认补货</button>
  </div>`);
  wireCheckItems('f-buyer');
}
function saveRestock(id){
  const it=data.items.find(x=>x.id===id); if(!it) return;
  const n=Number(document.getElementById('f-qty').value)||1;
  const buyer=(document.querySelector('#f-buyer input:checked')||{}).value;
  it.qty+=n; if(buyer) it.lastBuyer=buyer;
  save(); closeModal(); render(); toast(`已补货 ${n} ${it.unit}「${it.name}」`,'success');
}
function delItem(id){
  if(!confirm('确定删除该物品吗？')) return;
  data.items=data.items.filter(x=>x.id!==id);
  save(); render(); toast('已删除');
}

/* =====================================================================
   RULE (室友公约)
   ===================================================================== */
const RULE_CATS={作息:'🕐',访客:'👥',卫生:'🧽',财务:'💰',公共:'🏠',其他:'📌'};
function renderRule(){
  const c=document.getElementById('content');
  const rules=[...data.rules];
  c.innerHTML=`<div class="fade-in">
    <div class="card card-pad mb-16" style="background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:none">
      <div style="font-size:20px;font-weight:800">📜 室友公约</div>
      <div style="font-size:13.5px;opacity:.92;margin-top:6px">把约定写下来，减少误解。已达成 ${rules.length} 条共识，点击「同意」表示你的态度。</div>
    </div>
    ${rules.length===0?`<div class="card"><div class="empty"><div class="big">📜</div><div class="t">还没有公约</div><div class="s">和室友一起约定安静时间、访客规则、卫生分工等</div><button class="btn btn-primary" onclick="openRuleModal()">＋ 新建公约</button></div></div>`
    :`<div class="grid grid-2">
      ${rules.map(r=>{
        const cat=(RULE_CATS[r.cat]||'📌');
        const voted=(r.votes||[]).length;
        const pct=data.roommates.length? Math.round(voted/data.roommates.length*100):0;
        const myVote = data.roommates[0]? (r.votes||[]).includes(data.roommates[0].id) : false;
        return `<div class="card rule-card">
          <div class="rule-cat" style="color:var(--violet)">${cat} ${esc(r.cat)}</div>
          <div class="rule-title">${esc(r.title)}</div>
          <div class="rule-content">${esc(r.content)}</div>
          <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
            <button class="btn btn-sm ${myVote?'btn-soft':'btn-ghost'}" onclick="toggleVote('${r.id}')">${myVote?'✓ 已同意':'同意'}</button>
            <div style="flex:1">
              <div class="flex" style="justify-content:space-between;font-size:12px;color:var(--text3)"><span>${voted}/${data.roommates.length} 位室友同意</span><span>${pct}%</span></div>
              <div class="stock-bar" style="margin-top:5px"><div class="stock-fill" style="width:${pct}%;background:var(--violet)"></div></div>
            </div>
            <button class="kbd" style="color:var(--red)" onclick="delRule('${r.id}')">删除</button>
          </div>
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}
function openRuleModal(id){
  editingId=id||null;
  const r=id?data.rules.find(x=>x.id===id):null;
  openModal(`<div class="modal-head"><div class="modal-title">${r?'编辑公约':'新建公约'}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>标题 <span class="req">*</span></label><input class="input" id="f-title" placeholder="如：晚上 23:00 后保持安静" value="${r?esc(r.title):''}"></div>
    <div class="field"><label>分类</label>
      <div class="seg" id="f-cat">${Object.keys(RULE_CATS).map(k=>`<button data-c="${k}" class="${r&&r.cat===k?'active':(!r&&k==='公共')?'active':''}">${RULE_CATS[k]} ${k}</button>`).join('')}</div>
    </div>
    <div class="field"><label>内容</label><textarea class="input" id="f-content" placeholder="详细描述这条约定…">${r?esc(r.content):''}</textarea></div>
    <button class="btn btn-primary btn-block" onclick="saveRule()">保存公约</button>
  </div>`);
  document.querySelectorAll('#f-cat button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#f-cat button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
}
function saveRule(){
  const title=document.getElementById('f-title').value.trim();
  const content=document.getElementById('f-content').value.trim();
  if(!title){ toast('请填写公约标题','warn'); return; }
  if(!content){ toast('请填写公约内容','warn'); return; }
  const cat=(document.querySelector('#f-cat .active')||{dataset:{c:'其他'}}).dataset.c;
  if(editingId){
    const i=data.rules.findIndex(x=>x.id===editingId);
    data.rules[i]=Object.assign({}, data.rules[i], {title,content,cat});
  } else {
    data.rules.push({id:uid(),title,content,cat,votes:[],created:todayISO()});
  }
  save(); closeModal(); render(); toast('公约已保存','success');
}
function toggleVote(id){
  const r=data.rules.find(x=>x.id===id); if(!r) return;
  if(!data.roommates.length){ toast('请先添加室友','warn'); return; }
  const me=data.roommates[0].id;
  r.votes=r.votes||[];
  const i=r.votes.indexOf(me);
  if(i>=0) r.votes.splice(i,1); else r.votes.push(me);
  save(); render();
}
function delRule(id){
  if(!confirm('确定删除该公约吗？')) return;
  data.rules=data.rules.filter(r=>r.id!==id);
  save(); render(); toast('已删除');
}

/* =====================================================================
   ROOMMATE
   ===================================================================== */
function renderRoommate(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="fade-in">
    <div class="card card-pad mb-16">
      <div class="card-head"><span class="card-title">👥 同住室友（${data.roommates.length}）</span><button class="btn btn-primary btn-sm" onclick="openRoommateModal()">＋ 添加室友</button></div>
      ${data.roommates.length===0?`<div class="empty"><div class="big">👥</div><div class="t">还没有室友</div><div class="s">添加一起同住的小伙伴</div></div>`
      :`<div class="grid grid-2">
        ${data.roommates.map(r=>{
          const bal=computeBalances().find(b=>b.id===r.id);
          const paid=data.expenses.filter(e=>e.paidBy===r.id).reduce((s,e)=>s+Number(e.amount),0);
          return `<div class="card" style="box-shadow:none;border:1px solid var(--border);padding:18px">
            <div class="flex" style="gap:14px">
              ${avatarHTML(r,true)}
              <div class="item-main">
                <div class="item-title" style="font-size:16px">${esc(r.name)}</div>
                <div class="item-sub">已垫付 ${money(paid)} · 净结余 <b class="${bal.balance>0?'money-pos':bal.balance<0?'money-neg':''}" style="color:${bal.balance>0?'var(--teal)':bal.balance<0?'var(--primary)':'var(--text2)'}">${bal.balance>0?'+':''}${money(bal.balance)}</b></div>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <button class="kbd" onclick="openRoommateModal('${r.id}')">编辑</button>
                ${data.roommates.length>1?`<button class="kbd" style="color:var(--red)" onclick="delRoommate('${r.id}')">移除</button>`:''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
    <div class="card card-pad">
      <div class="card-title mb-16">⚙️ 数据管理</div>
      <div class="grid grid-2">
        <button class="btn btn-ghost" onclick="exportData()">📤 导出数据（JSON）</button>
        <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
        <button class="btn btn-ghost" onclick="resetDemo()">🎨 载入示例数据</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空所有数据</button>
      </div>
      <div class="muted mt-16" style="font-size:12.5px">数据保存在当前浏览器本地（localStorage），清除浏览器缓存会丢失数据，建议定期导出备份。</div>
    </div>
  </div>`;
}
function openRoommateModal(id){
  editingId=id||null;
  const r=id?data.roommates.find(x=>x.id===id):null;
  openModal(`<div class="modal-head"><div class="modal-title">${r?'编辑室友':'添加室友'}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>昵称 <span class="req">*</span></label><input class="input" id="f-name" placeholder="如：小夏" value="${r?esc(r.name):''}"></div>
    <div class="field"><label>头像颜色</label>
      <div class="flex" style="gap:8px;flex-wrap:wrap" id="f-color">
        ${AVATAR_COLORS.map(c=>`<button class="qty-btn" data-c="${c}" style="width:36px;height:36px;border-radius:50%;background:${c};${r&&r.color===c?'outline:3px solid #333':''}"></button>`).join('')}
      </div>
    </div>
    <button class="btn btn-primary btn-block mt-16" onclick="saveRoommate()">保存</button>
  </div>`);
  let color=r?r.color:AVATAR_COLORS[data.roommates.length%AVATAR_COLORS.length];
  document.querySelectorAll('#f-color button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#f-color button').forEach(x=>x.style.outline='none');
    b.style.outline='3px solid #333'; color=b.dataset.c;
  });
  window._rmColor=()=>color;
}
function saveRoommate(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ toast('请填写昵称','warn'); return; }
  const color=window._rmColor?window._rmColor():AVATAR_COLORS[0];
  if(editingId){
    const i=data.roommates.findIndex(x=>x.id===editingId);
    data.roommates[i]=Object.assign({},data.roommates[i],{name,color});
  } else {
    data.roommates.push({id:uid(),name,color});
  }
  save(); closeModal(); render(); toast('室友已保存','success');
}
function delRoommate(id){
  if(!confirm('移除该室友？其相关的账单、排班记录会保留但不再计入分摊。')) return;
  data.roommates=data.roommates.filter(r=>r.id!==id);
  save(); render(); toast('已移除');
}

/* ---------- data management ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`合租生活管家备份-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出备份','success');
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      data=Object.assign(defaultData(), d);
      save(); render(); toast('导入成功','success');
    }catch(e){ toast('导入失败：文件格式不正确','warn'); }
  };
  rd.readAsText(f);
  input.value='';
}
function resetDemo(){
  if(!confirm('将用示例数据覆盖当前数据，确定吗？')) return;
  localStorage.removeItem(LS_KEY);
  data=seed(); save(); render(); toast('已载入示例数据','success');
}
function clearAll(){
  if(!confirm('确定清空所有数据吗？此操作不可恢复。')) return;
  localStorage.removeItem(LS_KEY);
  data=defaultData(); save(); render(); toast('已清空');
}
function openExport(){ go('roommate'); }

/* ---------- modal ---------- */
function openModal(html){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML='';
  document.body.style.overflow='';
}

/* ---------- render ---------- */
function render(){
  renderNav();
  const pages={dashboard:renderDashboard,expense:renderExpense,chore:renderChore,item:renderItem,rule:renderRule,roommate:renderRoommate};
  (pages[currentPage]||renderDashboard)();
}

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
